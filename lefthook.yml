# lefthook.yml -- Git hooks configuration
# Runs checks in parallel for speed

pre-commit:
  parallel: true
  commands:
    lint:
      glob: "*.py"
      run: uv run ruff check --fix {staged_files}
      stage_fixed: true
    format:
      glob: "*.py"
      run: uv run ruff format {staged_files}
      stage_fixed: true
    typecheck:
      glob: "*.py"
      run: uv run pyright src/
    secrets:
      run: gitleaks protect --staged --verbose
    hadolint:
      glob: "Dockerfile*"
      run: hadolint {staged_files}
    terraform-fmt:
      glob: "infrastructure/**/*.tf"
      run: terraform -chdir=infrastructure fmt -check -recursive
    terraform-validate:
      glob: "infrastructure/**/*.tf"
      run: terraform -chdir=infrastructure validate
    terraform-docs:
      glob: "infrastructure/**/*.tf"
      run: terraform-docs markdown table --output-file README.md --output-mode inject infrastructure/ && git add infrastructure/README.md
      stage_fixed: true
    license-headers:
      glob: "*.{py,sh,tf}"
      run: ./scripts/check-license-headers.py
    workflow-lint:
      glob: ".github/workflows/*.{yml,yaml}"
      run: actionlint

pre-push:
  parallel: true
  commands:
    test:
      run: uv run pytest tests/ -x -q
    sast:
      run: uvx --python 3.13 semgrep scan --config auto --config p/python --config p/owasp-top-ten --config p/security-audit --exclude 'infrastructure/' --quiet .
    iac:
      glob: "infrastructure/**/*.tf"
      run: uvx checkov -d infrastructure/ --framework terraform --compact --quiet
    trivy-fs:
      # --skip-dirs .venv for the same reason as mise's security:fs: moto's
      # bundled fake CA keys inside an installed venv fail the secret pass.
      run: trivy fs --severity HIGH,CRITICAL --exit-code 1 --skip-dirs .venv --quiet .
    licenses:
      glob: "{uv.lock,pyproject.toml}"
      run: ./scripts/check-licenses.py

commit-msg:
  commands:
    conventional:
      run: uv run cz check --commit-msg-file {1}
