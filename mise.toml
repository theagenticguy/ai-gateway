# mise.toml -- AI Gateway project configuration
# Manages all tool versions, env vars, and project tasks

[tools]
python = "3.13"
"pipx:checkov" = "3.2.513"

# Security tools via aqua backend
"aqua:aquasecurity/trivy" = "0.69.2"
"aqua:anchore/grype" = "0.109.1"
"aqua:google/osv-scanner" = "2.3.3"
"aqua:hadolint/hadolint" = "2.14.0"
"aqua:evilmartians/lefthook" = "2.1.4"
"aqua:zricethezav/gitleaks" = "8.30.1"
"aqua:rhysd/actionlint" = "1.7.11"
# Produces the SBOM that `security:sbom-rescan` scans. Pinned like every other
# scanner here: an SBOM generator that moves under you changes the inventory
# without anyone editing the inventory.
"aqua:anchore/syft" = "1.43.0"

# IaC
"aqua:hashicorp/terraform" = "1.14.8"
"aqua:gruntwork-io/terragrunt" = "0.99.5"
"aqua:terraform-docs/terraform-docs" = "0.21.0"
tflint = "0.63.1"

[env]
_.python.venv = { path = ".venv", create = true }
PYTHONDONTWRITEBYTECODE = "1"
PYTHONUNBUFFERED = "1"

# ──────────────────────────────────────────────
# Core tasks
# ──────────────────────────────────────────────

[tasks.install]
description = "Install all project dependencies and git hooks"
run = ["uv sync", "lefthook install"]

# There is deliberately no `dev` task. The old one launched `app.main:app`, a
# FastAPI proxy that was deleted when the data plane moved to agentgateway
# (ADR-017), so it failed on ModuleNotFoundError for anyone who ran it. The
# local data-plane loop is the spike compose file:
# `docker compose -f spikes/agentgateway-data-plane/docker-compose.yaml up`.

[tasks.test]
description = "Run test suite"
run = "uv run pytest tests/ -v"
sources = ["src/**/*.py", "tests/**/*.py"]

[tasks.lint]
description = "Run linter and formatter check"
run = ["uv run ruff check .", "uv run ruff format --check ."]

[tasks.format]
description = "Auto-format all code"
run = ["uv run ruff format .", "uv run ruff check --fix .", "terraform -chdir=infrastructure fmt -recursive"]

[tasks.typecheck]
description = "Run type checker"
run = "uv run pyright src/"

# ──────────────────────────────────────────────
# Security tasks
# ──────────────────────────────────────────────

[tasks.security]
description = "Run all security scans"
depends = [
  "security:sast",
  "security:secrets",
  "security:iac",
  "security:dockerfile",
  "security:fs",
  "security:deps",
  "security:osv",
  "security:sbom-rescan",
  "security:licenses",
  "security:headers",
  "security:actionlint",
]

[tasks."security:sast"]
description = "SAST scan with semgrep"
run = "uvx semgrep scan --config auto --config p/python --config p/owasp-top-ten --config p/security-audit --exclude 'infrastructure/' ."

[tasks."security:secrets"]
description = "Secret detection with gitleaks"
run = "gitleaks detect --source . --verbose"

[tasks."security:iac"]
description = "IaC security scan with checkov"
run = "uvx checkov -d infrastructure/ --framework terraform --compact"

[tasks."security:dockerfile"]
description = "Lint Dockerfiles with hadolint"
run = "hadolint Dockerfile"

[tasks."security:image"]
description = "Scan container image with trivy"
run = "trivy image --severity HIGH,CRITICAL --exit-code 1 ai-gateway:latest"

[tasks."security:fs"]
description = "Filesystem vulnerability scan with trivy"
run = "trivy fs --severity HIGH,CRITICAL --exit-code 1 ."

[tasks."security:deps"]
description = "Audit Python dependencies for known vulnerabilities"
run = "uv export --no-dev --no-hashes > /tmp/requirements.txt && uvx pip-audit -r /tmp/requirements.txt --strict --desc"

[tasks."security:sbom"]
description = "CycloneDX + SPDX SBOMs into sbom/ (gitignored; CI publishes them as artifacts)"
# The rescan below used to read a `sbom.cyclonedx.json` that nothing in this repo
# produced. The only SBOM was built inside the `security-container` CI job from the
# built image and uploaded as an artifact, so `mise run security:sbom-rescan`
# failed locally with "no such file" for anyone who ran it. This task is the
# missing producer, and it covers the source tree rather than the image: it finds
# the npm and Python dependency graphs and the pinned GitHub Actions, which an
# image scan by construction cannot see.
#
# The excludes are the difference between an SBOM of what ships and an inventory of
# the workshop: `.terraform/` holds vendored provider binaries, `node_modules/` and
# `.venv/` are installed copies of what the lockfiles already declare.
run = """
mkdir -p sbom
syft . \
  --exclude './**/node_modules/**' \
  --exclude './.venv/**' \
  --exclude './infrastructure/**/.terraform/**' \
  -o cyclonedx-json=sbom/ai-gateway.cdx.json \
  -o spdx-json=sbom/ai-gateway.spdx.json -q
"""

[tasks."security:sbom-rescan"]
description = "Rescan the SBOM with Grype (catches newly disclosed CVEs)"
depends = ["security:sbom"]
# `fail-on-severity` and every accepted finding live in `.grype.yaml`, each with the
# reason it is accepted and the date it was checked.
run = "grype sbom:sbom/ai-gateway.cdx.json -q"

[tasks."security:osv"]
description = "Scan every lockfile in the tree against the OSV database"
# `scan source -r .` rather than two `--lockfile` flags. The explicit list named
# `uv.lock` and `docs/pnpm-lock.yaml` and therefore skipped
# `clients/admin_cli/uv.lock` (21 packages) entirely, and it would skip the next
# lockfile anyone adds — a scanner whose coverage is a hand-maintained list drifts
# silently the moment the tree grows. Recursive discovery found all three.
run = "osv-scanner scan source -r ."

[tasks."security:licenses"]
description = "Fail on a dependency license we have not accepted"
# The CI `licenses` job printed a table and exited 0 whatever it said. This is the
# enforcing version; the allowlist, the denied families, and the one evidenced
# exemption live in the script.
run = "./scripts/check-licenses.py"

[tasks."security:headers"]
description = "Every tracked .py/.sh/.tf file carries the SPDX license line"
run = "./scripts/check-license-headers.py"

[tasks."security:actionlint"]
description = "Lint GitHub Actions workflows (shellcheck included)"
# Present as `ci:lint` and reachable from `ci:validate`, but no workflow ran it, so
# a broken workflow was caught by being broken in production. Named here so it sits
# with the other gates and runs under `mise run security`.
run = "actionlint"

# ──────────────────────────────────────────────
# Terraform tasks
# ──────────────────────────────────────────────

[tasks."tf:init"]
description = "Initialize Terraform"
run = "terraform -chdir=infrastructure init"

[tasks."tf:plan"]
description = "Terraform plan (dry-run)"
run = "terraform -chdir=infrastructure plan"
depends = ["tf:init"]

[tasks."tf:fmt"]
description = "Format Terraform files"
run = "terraform -chdir=infrastructure fmt -recursive"

[tasks."tf:validate"]
description = "Validate Terraform configuration"
run = "terraform -chdir=infrastructure validate"
depends = ["tf:init"]

[tasks."tf:docs"]
description = "Generate Terraform documentation"
run = "terraform-docs markdown table --output-file README.md --output-mode inject infrastructure/"

# ──────────────────────────────────────────────
# Terragrunt tasks
# ──────────────────────────────────────────────

[tasks."tg:init"]
description = "Terragrunt init for a specific environment"
run = "terragrunt init"

[tasks."tg:plan"]
description = "Terragrunt plan for a specific environment"
run = "terragrunt plan"

[tasks."tg:plan-all"]
description = "Terragrunt plan all environments"
run = "terragrunt run-all plan --terragrunt-non-interactive"
dir = "terragrunt"

[tasks."tg:validate-all"]
description = "Terragrunt validate all environments"
run = "terragrunt run-all validate --terragrunt-non-interactive"
dir = "terragrunt"

# ──────────────────────────────────────────────
# CI tasks
# ──────────────────────────────────────────────

[tasks.ci]
description = "Full CI pipeline (lint, typecheck, test, security)"
depends = ["lint", "typecheck", "test", "security"]

[tasks."ci:lint"]
description = "CI-only: actionlint on GitHub workflows"
run = "actionlint"

[tasks."ci:validate"]
description = "CI-only: validate all CI + pre-commit in one shot"
depends = ["lint", "typecheck", "security", "tf:validate", "ci:lint"]

# ──────────────────────────────────────────────
# Release tasks
# ──────────────────────────────────────────────

[tasks."release:bump"]
description = "Auto-bump version based on commit history, generate changelog, and tag"
run = """
set -euo pipefail
uv run cz bump --changelog --no-verify
echo "Version bumped. Run 'git push origin main --tags' to release."
"""

[tasks."release:bump-patch"]
description = "Force a patch version bump with changelog"
run = """
set -euo pipefail
uv run cz bump --increment PATCH --changelog --no-verify
echo "Patch bump complete. Run 'git push origin main --tags' to release."
"""

[tasks."release:bump-minor"]
description = "Force a minor version bump with changelog"
run = """
set -euo pipefail
uv run cz bump --increment MINOR --changelog --no-verify
echo "Minor bump complete. Run 'git push origin main --tags' to release."
"""

[tasks."release:bump-major"]
description = "Force a major version bump with changelog"
run = """
set -euo pipefail
uv run cz bump --increment MAJOR --changelog --no-verify
echo "Major bump complete. Run 'git push origin main --tags' to release."
"""

[tasks."release:changelog"]
description = "Preview changelog for unreleased changes (dry-run)"
run = "uv run cz changelog --dry-run"

# ──────────────────────────────────────────────
# Bot tasks
# ──────────────────────────────────────────────

[tasks."bot:push"]
description = "Push local changes as verified bot commits via GitHub API"
usage = "mise run bot:push -- -b <branch> -m <message> [--pr] [--pr-body <body>]"
run = "uv run scripts/bot-push.py \"$@\""
raw = true

# ──────────────────────────────────────────────
# Documentation tasks
# ──────────────────────────────────────────────

[tasks."docs:install"]
description = "Install documentation site dependencies"
run = "pnpm install --frozen-lockfile"
dir = "docs"

[tasks."docs:serve"]
description = "Serve documentation locally with hot reload"
run = "pnpm dev"
dir = "docs"

[tasks."docs:build"]
description = "Build documentation site"
run = "pnpm build"
dir = "docs"

[tasks."docs:preview"]
description = "Preview built documentation site"
run = "pnpm preview"
dir = "docs"

# ──────────────────────────────────────────────
# Dependency upgrade tasks
#
# `deps:upgrade` bumps every ecosystem to the latest allowed versions and
# regenerates all lockfiles in one shot -- the manual equivalent of merging a
# batch of Dependabot PRs. `deps:lock` re-resolves locks WITHOUT upgrading
# (e.g. after a hand-edited pyproject.toml or package.json).
# ──────────────────────────────────────────────

[tasks."deps:upgrade"]
description = "Upgrade ALL deps (Python, npm, Terraform) and regenerate every lockfile"
depends = ["deps:python", "deps:npm", "deps:terraform"]

[tasks."deps:python"]
description = "Upgrade all Python deps to latest and sync the venv"
run = "uv sync --all-groups --all-packages -U"

[tasks."deps:npm"]
description = "Upgrade all docs npm pins to latest and refresh pnpm-lock.yaml"
dir = "docs"
env = { CI = "true" }
run = ["pnpm up --latest", "pnpm dedupe"]

[tasks."deps:terraform"]
description = "Upgrade Terraform providers, regenerate multi-platform lock, refresh README"
run = [
  "terraform -chdir=infrastructure init -upgrade -backend=false -input=false",
  "terraform -chdir=infrastructure providers lock -platform=linux_amd64 -platform=linux_arm64 -platform=darwin_amd64 -platform=darwin_arm64",
  "terraform-docs markdown table --output-file README.md --output-mode inject infrastructure/",
]

[tasks."deps:lock"]
description = "Re-resolve all lockfiles from current manifests WITHOUT upgrading"
depends = ["deps:lock-python", "deps:lock-npm"]

[tasks."deps:lock-python"]
description = "Re-resolve uv.lock from pyproject.toml constraints"
run = "uv lock"

[tasks."deps:lock-npm"]
description = "Re-resolve docs/pnpm-lock.yaml from package.json constraints"
dir = "docs"
env = { CI = "true" }
run = "pnpm install --no-frozen-lockfile"
